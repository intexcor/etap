<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ETAP · PDF в урок</title><style>body{margin:0;background:#10111e;color:#fff;font:16px Arial,sans-serif}main{max-width:700px;margin:12vh auto;padding:36px;background:#1d1e31;border-radius:24px}h1{font-size:42px;margin:0 0 12px}p{color:#c8c9d9;line-height:1.5}label{display:block;border:2px dashed #8177f5;padding:28px;border-radius:14px;margin:25px 0;text-align:center}button{background:#8b80ff;border:0;border-radius:10px;padding:14px 20px;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}pre{white-space:pre-wrap;background:#10111e;padding:16px;border-radius:12px;display:none}</style><main><h1>PDF → минутный урок</h1><p>Загрузите текстовый PDF до 15 МБ. Локальная LLM подготовит выжимку для универсального вертикального ролика.</p><label>Выбрать PDF<br><input id="file" type="file" accept="application/pdf"></label><button id="go">Создать сценарий</button><pre id="result"></pre></main><script>const file=document.querySelector('#file'),go=document.querySelector('#go'),result=document.querySelector('#result');go.onclick=async()=>{if(!file.files[0])return alert('Выберите PDF');go.disabled=true;go.textContent='Обрабатываем…';try{const r=await fetch('/api/lesson',{method:'POST',headers:{'x-file-name':encodeURIComponent(file.files[0].name),'content-type':'application/pdf'},body:file.files[0]});const data=await r.json();if(!r.ok)throw Error(data.error);result.style.display='block';result.textContent=JSON.stringify(data,null,2)+'\n\nСкопируйте JSON в public/generated/lesson.json и выполните npm run render:lesson.'}catch(e){alert(e.message)}finally{go.disabled=false;go.textContent='Создать сценарий'}}</script></html>

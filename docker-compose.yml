services:
  learntok:
    build: .
    ports: ["8787:8787"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      LEARNTOK_MODEL: ${LEARNTOK_MODEL:-claude-opus-5}
      # LEARNTOK_REGISTRATION: closed
    volumes:
      - learntok-data:/data
    restart: unless-stopped
volumes:
  learntok-data:
